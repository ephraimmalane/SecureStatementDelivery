services:
  web-api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      # Override localhost URLs from appsettings.Development.json with Docker service names
      - ConnectionStrings__Database=Host=postgres;Port=5432;Database=secure_statements;Username=postgres;Password=postgres;Include Error Detail=true
      - ConnectionStrings__Redis=redis:6379
      - Serilog__WriteTo__1__Args__ServerUrl=http://seq:5341
    ports:
      - "5000:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
