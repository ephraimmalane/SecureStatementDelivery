# ============================================================
# DATABASE MIGRATION JOB
# Applies EF Core migrations exactly once per release, BEFORE the Deployment rolls out.
# The app no longer migrates on normal startup in Production, so replicas never race to
# apply schema changes.
#
# Run order:
#   kubectl apply -f k8s/web-api/migration-job.yaml
#   kubectl wait --for=condition=complete --timeout=300s job/web-api-migrate -n secure-statements
#   kubectl apply -f k8s/web-api/deployment.yaml
#
# If you use Helm/Argo, the annotations below make this a pre-install/pre-upgrade hook.
# Re-applying requires deleting the completed Job first (or bump the name suffix per release).
# ============================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: web-api-migrate
  namespace: secure-statements
  labels:
    app.kubernetes.io/name: web-api
    app.kubernetes.io/component: migration
    app.kubernetes.io/part-of: secure-statement-delivery
  annotations:
    # Helm hook wiring (ignored by plain kubectl).
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    # Argo CD equivalent.
    argocd.argoproj.io/hook: PreSync
spec:
  backoffLimit: 3
  # Clean up the finished Job automatically after 1 hour.
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web-api
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      serviceAccountName: web-api-sa
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        fsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: secure-statement-delivery/web-api:latest
          imagePullPolicy: Always
          # One-shot migration mode handled in Program.cs; the process exits 0 when done.
          args: ["--migrate"]
          envFrom:
            - configMapRef:
                name: web-api-config
            - secretRef:
                name: web-api-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "500m"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
