# ============================================================
# EXTERNAL SECRETS — production-grade secret delivery
# Replaces the hand-edited k8s/secret.yaml template (plain base64, not encrypted at rest) with
# secrets sourced from AWS Secrets Manager via the External Secrets Operator (ESO).
#
# Prerequisites:
#   1. Install ESO:  helm install external-secrets external-secrets/external-secrets -n external-secrets --create-namespace
#   2. Grant the web-api IRSA role secretsmanager:GetSecretValue on the secrets below.
#   3. Create the source secrets in AWS Secrets Manager (see keys referenced under remoteRef).
#
# ESO writes a normal Kubernetes Secret named "web-api-secrets" — the Deployment's
# `secretRef: web-api-secrets` keeps working unchanged. Do NOT also apply k8s/secret.yaml.
#
# ROTATION: rotate the source value in Secrets Manager; ESO re-syncs every refreshInterval and
# the Deployment reloader (or `kubectl rollout restart deployment/web-api`) picks it up. The
# DownloadToken__Secret (HS256 signing key) should be rotated on a schedule — see
# docs/runbook-backups-dr.md for the dual-key overlap procedure that avoids invalidating
# in-flight download links.
# ============================================================
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: secure-statements
  labels:
    app.kubernetes.io/part-of: secure-statement-delivery
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        # Uses the pod's IRSA identity — no static AWS keys in cluster.
        jwt:
          serviceAccountRef:
            name: web-api-sa
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: web-api-secrets
  namespace: secure-statements
  labels:
    app.kubernetes.io/name: web-api
    app.kubernetes.io/part-of: secure-statement-delivery
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    # ESO creates/owns this Secret; the Deployment already references it.
    name: web-api-secrets
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: ConnectionStrings__Database
      remoteRef:
        key: secure-statements/prod/web-api
        property: ConnectionStrings__Database
    - secretKey: ConnectionStrings__Redis
      remoteRef:
        key: secure-statements/prod/web-api
        property: ConnectionStrings__Redis
    - secretKey: Keycloak__ClientSecret
      remoteRef:
        key: secure-statements/prod/web-api
        property: Keycloak__ClientSecret
    - secretKey: Keycloak__AdminPassword
      remoteRef:
        key: secure-statements/prod/web-api
        property: Keycloak__AdminPassword
    - secretKey: DownloadToken__Secret
      remoteRef:
        key: secure-statements/prod/web-api
        property: DownloadToken__Secret
    - secretKey: FieldEncryption__Key
      remoteRef:
        key: secure-statements/prod/web-api
        property: FieldEncryption__Key
