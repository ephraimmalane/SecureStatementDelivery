# ============================================================
# STANDALONE GRAFANA
# Auto-provisioned with the Prometheus datasource and a starter web-api dashboard. Minimal:
# single replica, emptyDir storage, admin password from a Secret (CHANGE_ME). Access via
# `kubectl -n monitoring port-forward svc/grafana 3000:3000` then http://localhost:3000.
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: secure-statement-delivery
type: Opaque
stringData:
  admin-user: admin
  admin-password: "CHANGE_ME_GRAFANA_ADMIN_PASSWORD"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: secure-statement-delivery
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        access: proxy
        url: http://prometheus.monitoring.svc:9090
        isDefault: true
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: default
        orgId: 1
        folder: "Secure Statement Delivery"
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
  web-api.json: |
    {
      "uid": "web-api-overview",
      "title": "Secure Statement Delivery — Web API",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "templating": { "list": [] },
      "annotations": { "list": [] },
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "HTTP request rate (by status)",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (http_response_status_code) (rate(http_server_request_duration_seconds_count{job=\"web-api\"}[5m]))",
              "legendFormat": "{{http_response_status_code}}"
            }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "5xx error ratio (SLO 0.5%)",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "percentunit" }, "overrides": [] },
          "targets": [
            { "refId": "A", "expr": "job:web_api_request_error_ratio:5m", "legendFormat": "5xx ratio" }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Request latency p95",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] },
          "targets": [
            { "refId": "A", "expr": "job:web_api_request_latency_p95:5m", "legendFormat": "p95" }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Statement ingestion (uploaded vs rejected)",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "ops" }, "overrides": [] },
          "targets": [
            { "refId": "A", "expr": "sum(rate(statements_uploaded_total{job=\"web-api\"}[5m]))", "legendFormat": "uploaded" },
            { "refId": "B", "expr": "sum(rate(statements_upload_rejected_total{job=\"web-api\"}[5m]))", "legendFormat": "rejected" }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Outbox dispatch (processed vs failed)",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "ops" }, "overrides": [] },
          "targets": [
            { "refId": "A", "expr": "sum(rate(outbox_processed_total{job=\"web-api\"}[5m]))", "legendFormat": "processed" },
            { "refId": "B", "expr": "sum(rate(outbox_failed_total{job=\"web-api\"}[5m]))", "legendFormat": "failed" }
          ]
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: secure-statement-delivery
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/part-of: secure-statement-delivery
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        fsGroup: 472
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: grafana
          image: grafana/grafana:11.2.0
          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: admin-user
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: admin-password
            # Provisioned datasource is read-only; disable sign-up and telemetry for a clean minimal run.
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"
          ports:
            - name: http
              containerPort: 3000
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: storage
              mountPath: /var/lib/grafana
            - name: provisioning
              mountPath: /etc/grafana/provisioning/datasources/datasources.yaml
              subPath: datasources.yaml
            - name: provisioning
              mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml
              subPath: dashboards.yaml
            - name: provisioning
              mountPath: /var/lib/grafana/dashboards/web-api.json
              subPath: web-api.json
      volumes:
        # Minimal: ephemeral. Swap for a PersistentVolumeClaim in production to keep users/prefs.
        - name: storage
          emptyDir: {}
        - name: provisioning
          configMap:
            name: grafana-provisioning
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: secure-statement-delivery
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP
