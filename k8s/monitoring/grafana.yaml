# ============================================================
# STANDALONE GRAFANA
# The grafana-provisioning ConfigMap (datasource + dashboards) is generated by kustomize from
# files on disk — see k8s/monitoring/kustomization.yaml. Apply this stack with:
#   kubectl apply -k k8s/monitoring
# Dashboard JSON lives in k8s/monitoring/dashboards/ and is the single source of truth shared
# with the local docker-compose Grafana. Minimal: single replica, emptyDir storage, admin
# password from a Secret (CHANGE_ME). Access via
# `kubectl -n monitoring port-forward svc/grafana 3000:3000` then http://localhost:3000.
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: secure-statement-delivery
type: Opaque
stringData:
  admin-user: admin
  admin-password: "CHANGE_ME_GRAFANA_ADMIN_PASSWORD"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: secure-statement-delivery
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/part-of: secure-statement-delivery
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        fsGroup: 472
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: grafana
          image: grafana/grafana:11.2.0
          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: admin-user
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: admin-password
            # Provisioned datasource is read-only; disable sign-up and telemetry for a clean minimal run.
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"
          ports:
            - name: http
              containerPort: 3000
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: storage
              mountPath: /var/lib/grafana
            - name: provisioning
              mountPath: /etc/grafana/provisioning/datasources/datasources.yaml
              subPath: datasources.yaml
            - name: provisioning
              mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml
              subPath: dashboards.yaml
            - name: provisioning
              mountPath: /var/lib/grafana/dashboards/web-api.json
              subPath: web-api.json
            - name: provisioning
              mountPath: /var/lib/grafana/dashboards/statements-revoked.json
              subPath: statements-revoked.json
      volumes:
        # Minimal: ephemeral. Swap for a PersistentVolumeClaim in production to keep users/prefs.
        - name: storage
          emptyDir: {}
        - name: provisioning
          configMap:
            name: grafana-provisioning
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: secure-statement-delivery
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP
