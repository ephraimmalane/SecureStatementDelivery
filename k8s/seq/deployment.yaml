apiVersion: apps/v1
kind: Deployment
metadata:
  name: seq
  namespace: secure-statements
  labels:
    app.kubernetes.io/name: seq
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: secure-statement-delivery
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: seq
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seq
        app.kubernetes.io/component: observability
        app.kubernetes.io/part-of: secure-statement-delivery
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: false  # Seq requires root to write to its data directory
        fsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: seq
          image: datalust/seq:2024.3
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
            - name: ingest
              containerPort: 5341
          env:
            - name: ACCEPT_EULA
              value: "Y"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: seq-data
