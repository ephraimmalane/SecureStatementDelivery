apiVersion: apps/v1
kind: Deployment
metadata:
  name: clamav
  namespace: secure-statements
  labels:
    app.kubernetes.io/name: clamav
    app.kubernetes.io/component: av-scanner
    app.kubernetes.io/part-of: secure-statement-delivery
spec:
  # Single replica: clamd holds the signature DB in memory. Scale up only if scan throughput needs it.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: clamav
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clamav
        app.kubernetes.io/component: av-scanner
        app.kubernetes.io/part-of: secure-statement-delivery
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: clamav
          image: clamav/clamav:1.4
          imagePullPolicy: IfNotPresent
          ports:
            - name: clamd
              containerPort: 3310
              protocol: TCP
          # clamd needs ~1-2 GB resident for the signature database.
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          # clamd is slow to start (loads the signature DB). Give it generous startup headroom; the
          # web-api fails uploads closed until clamd is reachable, so this gates real availability.
          startupProbe:
            tcpSocket:
              port: 3310
            failureThreshold: 40
            periodSeconds: 15
          livenessProbe:
            tcpSocket:
              port: 3310
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 3310
            periodSeconds: 15
            failureThreshold: 3
          volumeMounts:
            - name: clamav-config
              mountPath: /etc/clamav/clamd.conf
              subPath: clamd.conf
              readOnly: true
            - name: signatures
              mountPath: /var/lib/clamav
            - name: run
              mountPath: /run/clamav
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: clamav-config
          configMap:
            name: clamav-config
        # emptyDir: freshclam re-downloads signatures on restart. Swap for a PVC to persist them.
        - name: signatures
          emptyDir:
            sizeLimit: 2Gi
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
