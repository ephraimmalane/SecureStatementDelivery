# ============================================================
# SECRET TEMPLATE — DO NOT COMMIT REAL VALUES TO SOURCE CONTROL
# Replace every CHANGE_ME placeholder before applying.
# Production: use Sealed Secrets, Vault, or External Secrets Operator.
# Generate secrets: openssl rand -hex 32
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: web-api-secrets
  namespace: secure-statements
  labels:
    app.kubernetes.io/part-of: secure-statement-delivery
type: Opaque
stringData:
  # PostgreSQL connection string
  ConnectionStrings__Database: "Host=postgres;Port=5432;Database=secure_statements;Username=app_user;Password=CHANGE_ME_DB_PASSWORD;Include Error Detail=false"
  # Redis connection string
  ConnectionStrings__Redis: "redis:6379"
  # Keycloak OIDC client secret (must match keycloak-secrets.KEYCLOAK_CLIENT_SECRET)
  Keycloak__ClientSecret: "CHANGE_ME_CLIENT_SECRET"
  # Keycloak admin credentials — used only for Admin REST API calls (user registration)
  Keycloak__AdminPassword: "CHANGE_ME_KEYCLOAK_ADMIN_PASSWORD"
  # Download-token signing key (HS256) — minimum 32 characters, separate from Keycloak
  DownloadToken__Secret: "CHANGE_ME_USE_MINIMUM_32_CHARACTER_DOWNLOAD_TOKEN_KEY"
  # During a key rotation, set the OLD key here (also ≥32 chars) so links signed before the
  # rotation keep validating until their TTL elapses. Remove after the overlap window.
  # DownloadToken__PreviousSecrets__0: "PREVIOUS_32_CHARACTER_DOWNLOAD_TOKEN_KEY"
  # Field-encryption key (AES-256-GCM) protecting customer SA ID numbers at rest.
  # Must be base64 of exactly 32 bytes. Generate: openssl rand -base64 32
  # WARNING: losing/rotating this key makes stored ID numbers unrecoverable (statements can no
  # longer be password-protected). Back it up in your KMS/secret store.
  FieldEncryption__Key: "CHANGE_ME_BASE64_32_BYTE_KEY"
---
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-secrets
  namespace: secure-statements
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: secure-statement-delivery
type: Opaque
stringData:
  # Keycloak admin console password
  KEYCLOAK_ADMIN_PASSWORD: "CHANGE_ME_KEYCLOAK_ADMIN_PASSWORD"
  # Client secret injected into realm-export.json via ${KEYCLOAK_CLIENT_SECRET} substitution.
  # Must match web-api-secrets.Keycloak__ClientSecret.
  KEYCLOAK_CLIENT_SECRET: "CHANGE_ME_CLIENT_SECRET"
  # Secret for the statement-generator service account (M2M ingestion), injected into
  # realm-export.json via ${KEYCLOAK_INGEST_CLIENT_SECRET}. Rotate independently of the API client.
  KEYCLOAK_INGEST_CLIENT_SECRET: "CHANGE_ME_INGEST_CLIENT_SECRET"
  # PostgreSQL credentials for Keycloak's own database
  KC_DB_PASSWORD: "CHANGE_ME_DB_PASSWORD"
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: secure-statements
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: secure-statement-delivery
type: Opaque
stringData:
  POSTGRES_DB: "secure_statements"
  POSTGRES_USER: "app_user"
  POSTGRES_PASSWORD: "CHANGE_ME_DB_PASSWORD"
