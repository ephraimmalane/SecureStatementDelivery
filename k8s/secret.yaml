# ============================================================
# SECRET TEMPLATE — DO NOT COMMIT REAL VALUES TO SOURCE CONTROL
# Replace every CHANGE_ME placeholder before applying.
# Production recommendation: use Sealed Secrets, Vault, or the
# External Secrets Operator to manage secrets outside of Git.
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: web-api-secrets
  namespace: secure-statements
  labels:
    app.kubernetes.io/part-of: secure-statement-delivery
type: Opaque
stringData:
  # Full PostgreSQL connection string (includes password)
  ConnectionStrings__Database: "Host=postgres;Port=5432;Database=secure_statements;Username=app_user;Password=CHANGE_ME_DB_PASSWORD;Include Error Detail=false"
  # Redis connection string
  ConnectionStrings__Redis: "redis:6379"
  # JWT signing key — minimum 32 characters
  Jwt__Secret: "CHANGE_ME_USE_MINIMUM_32_CHARACTER_JWT_SECRET_KEY_HERE"
  # Download token signing key — minimum 32 characters
  DownloadToken__Secret: "CHANGE_ME_USE_MINIMUM_32_CHARACTER_DOWNLOAD_TOKEN_KEY"
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: secure-statements
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: secure-statement-delivery
type: Opaque
stringData:
  POSTGRES_DB: "secure_statements"
  POSTGRES_USER: "app_user"
  POSTGRES_PASSWORD: "CHANGE_ME_DB_PASSWORD"
