# Minimal clamd configuration overriding the image default, chiefly to raise the INSTREAM size
# limit above the application's 50 MB upload cap (default is 25 MB). Other settings fall back to
# clamd's compiled defaults.

# Listen on TCP for nClam (INSTREAM scanning). Bind to all interfaces inside the container network.
TCPSocket 3310
TCPAddr 0.0.0.0

# Signature database location (image default).
DatabaseDirectory /var/lib/clamav

# Size limits — must clear Storage:MaxUploadBytes (50 MB) with headroom.
StreamMaxLength 64M
MaxFileSize 64M
MaxScanSize 256M

# Reasonable archive-bomb protections.
MaxRecursion 16
MaxFiles 10000

LogTime yes
