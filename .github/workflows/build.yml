name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  DOTNET_VERSION: "10.x"
  SOLUTION: SecureStatementDelivery.slnx

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION }} --configuration Release --no-restore

      - name: Test
        run: dotnet test ${{ env.SOLUTION }} --configuration Release --no-restore --no-build

      - name: Publish
        run: dotnet publish ${{ env.SOLUTION }} --configuration Release --no-restore --no-build

      # Validate the production Dockerfile still builds (no push) so a broken image
      # is caught on PRs, not at release time.
      - name: Validate Docker build
        run: docker build -t web-api:ci -f src/Web.Api/Dockerfile .
