# Prometheus scrape config for the .NET Aspire AppHost.
#
# Under Aspire the web-api runs as a host process (not a compose container), so Prometheus —
# which runs as a container — reaches it over the Docker Desktop host gateway rather than by a
# compose service name. The target port MUST match the web-api HTTP endpoint declared in
# src/Web.Api/Properties/launchSettings.json (the "http" profile → 5000).
#
# The job label MUST stay "web-api" so it matches the dashboard queries ({job="web-api"}) and the
# recording rules in rules.yml (mounted alongside this file).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: web-api
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:5000"]
